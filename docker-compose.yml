# Self-run PostgreSQL (decision D4): local development, and the fallback database
# if Replit credit runs out. Start: docker compose up -d   Stop: docker compose down
# Local-only credentials; matches DATABASE_URL in .env.example.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbyte
      POSTGRES_PASSWORD: orbyte
      POSTGRES_DB: orbyte
    # Port 5433, not the usual 5432, so it never clashes with another Postgres on the laptop.
    # Postgres listens on 5433 inside the container too, so the same URL works from scripts/db-backup.ts.
    command: ["postgres", "-p", "5433"]
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbyte -d orbyte -p 5433"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
